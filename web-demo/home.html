<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="light dark" />
<script src="theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Caire — Caritas Würzburg partner intelligence</title>
<meta name="description" content="Caire helps Caritas Würzburg discover corporate partners in Mainfranken whose CSR values fit." />
<link rel="icon" type="image/png" href="logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--bg2:#f5f5f5;--card:#ffffff;--text:#1e1e1e;--soft:#5a5a5a;--accent:#cc201e;--accent-h:#a81a18;--accent-soft:#cc201e14;--border:#e6e6e6;--shadow:0 10px 30px -18px #1e1e1e33;--on-accent:#fff;}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:17px}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:Montserrat,Inter,sans-serif;line-height:1.3}
.container{max-width:1200px;margin:0 auto;padding:0 clamp(1.25rem,4vw,3rem)}
nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
nav .container{display:flex;align-items:center;gap:1.5rem;height:64px}
.brand{display:flex;align-items:center;gap:.65rem;font-family:Montserrat;font-weight:800;font-size:1.15rem;color:var(--text);text-decoration:none}
.brand img{height:38px;width:auto}
nav .links{margin-left:auto;display:flex;gap:1.5rem;align-items:center}
nav .links a{color:var(--soft);text-decoration:none;font-size:.9rem;font-weight:500}
:root[data-theme="dark"]{--bg:#141414;--bg2:#1b1b1b;--card:#1e1e1e;--text:#f2f2f2;--soft:#b5b5b5;--accent:#ff5450;--accent-h:#ff7b77;--accent-soft:#ff545024;--border:#333333;--shadow:0 10px 30px -18px #000000cc;--on-accent:#141414;}
nav .links a:hover{color:var(--accent)}
.lang{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;color:var(--soft);font:600 .8rem Inter,sans-serif;padding:.3rem .7rem;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--on-accent)}
nav .links a.btn{color:var(--on-accent);padding:.45rem 1rem}
.hero{padding:5rem 0 3rem;display:grid;grid-template-columns:1.3fr .7fr;gap:3rem;align-items:center}
.greeting{font-family:'Fira Code',monospace;color:var(--accent);margin-bottom:1rem;font-size:.95rem}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);font-weight:800;letter-spacing:-.03em;margin-bottom:.75rem}
.sub{color:var(--accent);font-weight:600;font-size:clamp(1.1rem,2.4vw,1.5rem);margin-bottom:1.25rem}
.desc{color:var(--soft);max-width:60ch;font-size:1.05rem;margin-bottom:2rem}
.actions{display:flex;flex-wrap:wrap;gap:.85rem}
.btn{display:inline-block;padding:.75rem 1.4rem;border-radius:10px;font-weight:600;text-decoration:none;font-size:.95rem;transition:all .25s;border:1.5px solid var(--accent)}
.btn-p{background:var(--accent);color:var(--on-accent)}.btn-p:hover{background:var(--accent-h);transform:scale(1.03)}
.btn-s{color:var(--accent)}.btn-s:hover{background:var(--accent-soft);transform:scale(1.03)}
.logo-wrap{display:flex;justify-content:center}
.logo-wrap img{width:min(380px,80vw);animation:reveal 1s cubic-bezier(.22,1,.36,1) both}
.red{color:var(--accent)}
button.btn{font:inherit;cursor:pointer;background:none}
#explore.pulse{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 8px var(--accent-soft)}}
@keyframes reveal{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:none}}
section{padding:4rem 0}
.eyebrow{font-family:'Fira Code',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-size:.8rem;display:block;margin-bottom:.6rem}
h2{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:800;letter-spacing:-.02em;margin-bottom:2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.25rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.5rem;box-shadow:var(--shadow);transition:transform .25s}
.card:hover{transform:translateY(-4px)}
.card h3{font-size:1.1rem;margin-bottom:.5rem}.card p{color:var(--soft);font-size:.95rem}
.stats{background:var(--bg2);border-block:1px solid var(--border)}
.stats .grid{text-align:center}.stats b{font-family:Montserrat;font-size:2.4rem;color:var(--accent);display:block}.stats span{color:var(--soft);font-size:.9rem}
footer{padding:2rem 0;color:var(--soft);font-size:.85rem;text-align:center;border-top:1px solid var(--border)}
@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:3rem}.logo-wrap{order:-1;justify-content:flex-start}.logo-wrap img{width:220px}}
@media(max-width:520px){nav .links a:not(.btn){display:none}}
@media(prefers-reduced-motion:reduce){.logo-wrap img{animation:none}}
</style>
</head>
<body>
<nav><div class="container">
  <a class="brand" href="home.html"><img src="logo.png" alt="Caire"></a>
  <div class="links"><span class="lang"><button data-l="de">DE</button><button data-l="en">EN</button></span><a class="btn btn-p map-link" href="map.html" data-i18n="open">Open map</a></div>
</div></nav>

<main class="container">
  <div class="hero">
    <div>
      <p class="greeting" data-i18n="greeting">&gt; Hi, we are Caire</p>
      <h1 data-i18n-html="title">Partner intelligence for <span class="red">Caritas</span> Würzburg</h1>
      <p class="sub" data-i18n="sub">Find companies in Mainfranken whose values fit.</p>
      <div class="actions"><a class="btn btn-p map-link" id="explore" href="map.html" data-i18n="explore">Explore the map</a><button class="btn btn-s" id="intro-btn" hidden></button></div>
    </div>
    <div class="logo-wrap"><img src="logo.png" alt="Caire logo"></div>
  </div>
</main>

<footer data-i18n="footer">Caire · Caritas Würzburg hackathon demo</footer>
<script>
const STR = {
  en:{greeting:'> Hi, we are Caire', title:'Partner intelligence for <span class="red">Caritas</span> Würzburg', sub:'Find companies in Mainfranken whose values fit.',
      open:'Open map', explore:'Explore the map', footer:'Caire · Caritas Würzburg hackathon demo', play:'▶ Meet Caire', pause:'❚❚ Pause'},
  de:{greeting:'> Hallo, wir sind Caire', title:'Partnersuche für die <span class="red">Caritas</span> Würzburg', sub:'Unternehmen in Mainfranken finden, deren Werte passen.',
      open:'Karte öffnen', explore:'Zur Karte', footer:'Caire · Hackathon-Demo für die Caritas Würzburg', play:'▶ Caire kennenlernen', pause:'❚❚ Pause'}
};
// Language: ?lang= wins, else the last choice on any Caire page (stored per browser).
function initialLang(){
  const q = new URLSearchParams(location.search).get('lang');
  if(q==='de' || q==='en') return q;
  try{ return localStorage.getItem('caire-lang')==='de' ? 'de' : 'en'; }catch(e){ return 'en'; }
}
function setLang(l){
  try{ localStorage.setItem('caire-lang', l); }catch(e){}
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i18n]').forEach(el=> el.textContent = STR[l][el.dataset.i18n]);
  document.querySelectorAll('[data-i18n-html]').forEach(el=> el.innerHTML = STR[l][el.dataset.i18nHtml]);
  document.querySelectorAll('.map-link').forEach(a=> a.href = 'map.html?lang=' + l);
  document.querySelectorAll('.lang button').forEach(b=> b.classList.toggle('on', b.dataset.l===l));
  loadIntro(l);
}
// Spoken intro (ElevenLabs clips made by make_intro_audio.py). Browsers block autoplay, so it starts on click;
// the button stays hidden if the clip for this language hasn't been generated yet.
const introBtn = document.getElementById('intro-btn');
let intro = null, introLang = 'en';
function loadIntro(l){
  if(intro){ intro.pause(); }
  introLang = l;
  intro = new Audio(`intro_${l}.mp3`);
  intro.preload = 'metadata';
  intro.addEventListener('loadedmetadata', ()=>{ introBtn.hidden = false; });
  intro.addEventListener('error', ()=>{ introBtn.hidden = true; });
  intro.addEventListener('play', syncIntro); intro.addEventListener('pause', syncIntro);
  intro.addEventListener('ended', ()=>{ syncIntro(); const e = document.getElementById('explore'); e.classList.remove('pulse'); void e.offsetWidth; e.classList.add('pulse'); });
  syncIntro();
}
function syncIntro(){ introBtn.textContent = STR[introLang][intro && !intro.paused ? 'pause' : 'play']; }
introBtn.onclick = ()=> intro.paused ? intro.play() : intro.pause();
document.querySelectorAll('.lang button').forEach(b=> b.onclick = ()=> setLang(b.dataset.l));
setLang(initialLang());
</script>
</body>
</html>
